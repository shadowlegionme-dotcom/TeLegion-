
name: TeLegion Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
      - "TMessagesProj/**"
      - "TMessagesProj_App/**"
      - "TMessagesProj_Modules/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "buildSrc/**"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: telegion-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TeLegion APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # 1. Checkout source
      - name: Checkout Telegram source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Accept SDK licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses

      # 5. Install SDK packages
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      # 6. Verify SDK
      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "Android SDK setup successful."

      # 7. Sync submodule URLs
      - name: Sync submodules
        run: |
          git submodule sync --recursive

      # 8. Initialize nested submodules
      - name: Initialize submodules
        run: |
          git submodule update \
            --init \
            --recursive \
            --jobs 4

      # 9. Verify submodules
      - name: Verify required submodules
        run: |
          git submodule status --recursive

          git submodule status --recursive | awk '
            $2 ~ /\/quickjs\/test262$/ {
              print "Skipping optional iOS test262 test suite"
              next
            }

            substr($1, 1, 1) == "-" ||
            substr($1, 1, 1) == "U" {
              print "ERROR: Uninitialized submodule:", $0
              failed = 1
            }

            END {
              if (failed) {
                print "Submodule verification failed."
                exit 1
              }

              print "Required submodules verified."
            }
          '

      # 10. Prepare Gradle
      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      # Nijer API ID/hash (repo Settings > Secrets and variables > Actions)
      - name: Inject Telegram API keys
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [[ ! "$TG_API_ID" =~ ^[0-9]+$ || ! "$TG_API_HASH" =~ ^[0-9a-f]{32}$ ]]; then
            echo "ERROR: TG_API_ID / TG_API_HASH secret nai ba format vul."
            exit 1
          fi
          sed -i -E "s/(int APP_ID = )[0-9]+;/\1${TG_API_ID};/" "$F"
          sed -i -E "s/(String APP_HASH = )\"[^\"]*\";/\1\"${TG_API_HASH}\";/" "$F"
          grep -q "int APP_ID = ${TG_API_ID};" "$F"
          grep -q "String APP_HASH = \"${TG_API_HASH}\";" "$F"

      # 11. Build baseline APK
      - name: Build Afat Debug APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            :TMessagesProj_App:assembleAfatDebug

      # 12. Verify APK
      - name: Verify APK output
        run: |
          echo "Searching for APK files..."

          find TMessagesProj_App/build/outputs/apk \
            -type f -name "*.apk" -print

          APK_COUNT=$(find TMessagesProj_App/build/outputs/apk \
            -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "APK generation successful."

      # 13. Upload APK artifact
      - name: Upload TeLegion APK
        uses: actions/upload-artifact@v4
        with:
          name: TeLegion-Baseline-Debug-APK
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      # 14. Upload diagnostics if failed
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TeLegion-Build-Diagnostics
          path: |
            **/build/reports/
            **/build/outputs/logs/
            **/build/tmp/
          if-no-files-found: ignore
          retention-days: 7
